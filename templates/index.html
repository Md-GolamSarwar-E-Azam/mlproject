<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Prediction</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #172033;
            background: #f3f6fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            background:
                radial-gradient(circle at top left, #e1edff 0, transparent 34rem),
                #f3f6fb;
        }

        .page {
            width: min(100%, 820px);
            margin: 0 auto;
        }

        .page-heading {
            margin-bottom: 28px;
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #3569c8;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #172033;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            letter-spacing: -0.04em;
        }

        .intro {
            margin: 12px 0 0;
            color: #68758a;
            font-size: 1rem;
            line-height: 1.6;
        }

        .card {
            padding: clamp(22px, 5vw, 38px);
            border: 1px solid #e5eaf2;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 18px 50px rgba(31, 52, 89, 0.09);
        }

        .card-title {
            margin: 0 0 24px;
            font-size: 1.2rem;
            font-weight: 650;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .mb-3 {
            min-width: 0;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #344158;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            min-height: 48px;
            padding: 11px 13px;
            border: 1px solid #d5dce8;
            border-radius: 9px;
            outline: none;
            background: #fff;
            color: #172033;
            font: inherit;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        .form-control:focus {
            border-color: #4a7fe0;
            box-shadow: 0 0 0 3px rgba(74, 127, 224, 0.16);
        }

        .form-control::placeholder {
            color: #8994a6;
        }

        .form-actions {
            margin-top: 26px;
        }

        .btn-primary {
            width: 100%;
            min-height: 50px;
            padding: 12px 18px;
            border: 0;
            border-radius: 9px;
            background: #3569c8;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 650;
            transition: background-color 150ms ease, transform 150ms ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            background: #2857ad;
        }

        .result {
            margin: 22px 0 0;
            padding: 16px 18px;
            border: 1px solid #dce8fb;
            border-radius: 10px;
            background: #f5f8fe;
            color: #344158;
            font-size: 1rem;
        }

        .result strong {
            color: #234f9e;
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 14px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="page-heading">
            <p class="eyebrow">Student success insights</p>
            <h1>Student Exam Performance Indicator</h1>
            <p class="intro">Enter the student details below to estimate their mathematics score.</p>
        </header>

        <section class="card">
            <form action="{{ url_for('predict_datapoint')}}" method="post">
                <h2 class="card-title">Student details</h2>

                <div class="form-grid">
                    <div class="mb-3">
                        <label class="form-label">Gender</label>
                        <select class="form-control" name="gender" placeholder="Enter you Gender" required>
                            <option class="placeholder" selected disabled value="">Select your Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Race or Ethnicity</label>
                        <select class="form-control" name="ethnicity" placeholder="Enter you ethnicity" required>
                            <option class="placeholder" selected disabled value="">Select Ethnicity</option>
                            <option value="group A">Group A</option>
                            <option value="group B">Group B</option>
                            <option value="group C">Group C</option>
                            <option value="group D">Group D</option>
                            <option value="group E">Group E</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Parental Level of Education</label>
                        <select class="form-control" name="parental_level_of_education"
                            placeholder="Enter you Parent Education" required>
                            <option class="placeholder" selected disabled value="">Select Parent Education</option>
                            <option value="associate's degree">associate's degree</option>
                            <option value="bachelor's degree">bachelor's degree</option>
                            <option value="high school">high school</option>
                            <option value="master's degree">master's degree</option>
                            <option value="some college">some college</option>
                            <option value="some high school">some high school</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Lunch Type</label>
                        <select class="form-control" name="lunch" placeholder="Enter you Lunch" required>
                            <option class="placeholder" selected disabled value="">Select Lunch Type</option>
                            <option value="free/reduced">free/reduced</option>
                            <option value="standard">standard</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Test preparation Course</label>
                        <select class="form-control" name="test_preparation_course" placeholder="Enter you Course"
                            required>
                            <option class="placeholder" selected disabled value="">Select Test_course</option>
                            <option value="none">None</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Writing Score out of 100</label>
                        <input class="form-control" type="number" name="reading_score"
                            placeholder="Enter your Reading score" min='0' max='100' />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Reading Score out of 100</label>
                        <input class="form-control" type="number" name="writing_score"
                            placeholder="Enter your Reading Score" min='0' max='100' />
                    </div>
                </div>

                <div class="form-actions">
                    <input class="btn-primary" type="submit" value="Predict your Maths Score" required />
                </div>
            </form>

            <p class="result"><strong>Prediction:</strong> {{results}}</p>
        </section>
    </main>
</body>
</html>
